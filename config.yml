backend:
  name: turbo-github
  turbo_site_id: 662911b0-0a03-4dab-8c43-307d8365f538
  branch: main

media_folder: "assets/uploads"
public_folder: "/Milora-web/assets/uploads"

collections:
  - name: "products"
    label: "E-knihy"
    files:
      - name: "catalog"
        label: "Katalog e-knih"
        file: "data/products.json"
        format: "json"
        fields:
          - label: "Produkty"
            name: "products"
            widget: "list"
            fields:
              - { label: "Název", name: "title", widget: "string" }
              - { label: "Cena v Kč", name: "price", widget: "number", value_type: "int" }
              - { label: "Popis", name: "description", widget: "text" }
              - { label: "Obálka", name: "cover", widget: "image", required: false }
              - { label: "Odkaz na Payhip", name: "payhip_url", widget: "string" }
